<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #f43f5e;
      --pill: #38bdf8;
    }
    body {
      margin: 0;
      width: 440px;
      max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    header {
      padding: 14px 16px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .count-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }
    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-clear:hover {
      background: var(--card-bg);
      color: var(--text);
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--pill);
    }
    .site-exclusions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin: 10px 0 0;
      padding: 0;
      border: 0;
    }
    .site-exclusions legend {
      margin-bottom: 5px;
      padding: 0;
      color: var(--subtext);
      font-size: 11px;
    }
    .site-exclusions label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .site-exclusions input {
      margin: 0;
      accent-color: var(--pill);
    }
    #auditList {
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
    }
    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--subtext);
    }
    .item-tag {
      background: rgba(56, 189, 248, 0.15);
      color: var(--pill);
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
    }
    .snippet {
      line-height: 1.4;
      color: #cbd5e1;
      word-break: break-word;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
    .actions a {
      color: var(--pill);
      text-decoration: none;
      font-size: 11px;
    }
    .actions a:hover {
      text-decoration: underline;
    }
    .empty-state {
      text-align: center;
      color: var(--subtext);
      padding: 40px 0;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h2>Blocked Media <span id="totalBadge" class="count-badge">0</span></h2>
      <button id="clearLogBtn" class="btn-clear">Clear Log</button>
    </div>
    <input type="text" id="searchInput" placeholder="Search blocked text or triggers...">
    <fieldset id="siteExclusions" class="site-exclusions">
      <legend>Exclude sites from filtering</legend>
      <label><input type="checkbox" data-excluded-site="youtube.com"> YouTube</label>
      <label><input type="checkbox" data-excluded-site="twitch.tv"> Twitch</label>
      <label><input type="checkbox" data-excluded-site="reddit.com"> Reddit</label>
      <label><input type="checkbox" data-excluded-site="x.com"> X / Twitter</label>
    </fieldset>
  </header>

  <div id="auditList"></div>

  <script src="popup.js"></script>
</body>
</html>
